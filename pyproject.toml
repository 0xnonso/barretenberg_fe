# Python tooling for scripts/ only; Ruff is pinned in toolchain.lock.json (make setup).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplifications
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
